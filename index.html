<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <!-- 홈 화면 앱(전체화면)으로 동작하게 하는 설정 -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="할 일" />
  <meta name="theme-color" content="#F4F2EC" />
  <title>할 일</title>
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%232F5D4F'/%3E%3Cpath d='M55 92l22 22 48-54' fill='none' stroke='white' stroke-width='14' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root{
      --paper:#F4F2EC; --card:#FFFFFF; --ink:#1F1E1B; --muted:#9C988D;
      --line:#E7E3D9; --pine:#2F5D4F; --pineSoft:#EAF1ED;
      --serif:'Gowun Batang', serif;
      --sans:'Noto Sans KR', -apple-system, sans-serif;
      --mono:'JetBrains Mono', monospace;
    }
    *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body{ margin:0; }
    body{
      background:var(--paper); color:var(--ink); font-family:var(--sans);
      min-height:100vh;
      padding:
        calc(env(safe-area-inset-top) + 32px)
        calc(env(safe-area-inset-right) + 18px)
        calc(env(safe-area-inset-bottom) + 24px)
        calc(env(safe-area-inset-left) + 18px);
    }
    .wrap{ max-width:460px; margin:0 auto; }
    .eyebrow{ font-family:var(--mono); color:var(--muted); letter-spacing:.12em; font-size:12px; text-transform:uppercase; margin-bottom:8px; }
    h1{ font-family:var(--serif); font-weight:700; font-size:40px; line-height:1; margin:0; }
    .progress{ display:flex; align-items:center; gap:12px; margin-top:20px; }
    .track{ flex:1; height:4px; background:var(--line); border-radius:999px; overflow:hidden; }
    .bar{ height:100%; width:0%; background:var(--pine); border-radius:999px; transition:width .38s cubic-bezier(.4,0,.2,1); }
    .pct{ font-family:var(--mono); font-size:12px; color:var(--muted); }

    .inputRow{ display:flex; align-items:center; gap:8px; margin:20px 0; padding:6px; background:var(--card); border:1px solid var(--line); border-radius:14px; }
    .inputRow input{ flex:1; border:none; outline:none; background:transparent; font-family:var(--sans); font-size:16px; color:var(--ink); padding:8px 12px; }
    .add{ width:38px; height:38px; border:none; border-radius:10px; background:var(--pine); color:#fff; font-size:22px; line-height:1; opacity:.45; transition:opacity .15s; }
    .add.on{ opacity:1; }

    .filters{ display:flex; align-items:center; gap:4px; margin-bottom:12px; }
    .filters .sp{ flex:1; }
    .chip{ border:none; background:transparent; font-family:var(--sans); font-size:13px; color:var(--muted); padding:6px 12px; border-radius:8px; }
    .chip.on{ color:var(--pine); background:var(--pineSoft); font-weight:700; }
    .clear{ border:none; background:transparent; font-family:var(--sans); font-size:12px; color:var(--muted); padding:6px 8px; }
    .searchRow{ display:none; margin:0 0 12px; }
    .searchRow.open{ display:flex; }

    ul{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; }
    li.item{ display:flex; align-items:center; gap:12px; padding:12px 14px; background:var(--card); border:1px solid var(--line); border-radius:12px; animation:rise .24s ease both; }
    @keyframes rise{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
    .dot{ width:22px; height:22px; flex:none; border-radius:999px; border:1.5px solid var(--line); background:transparent; color:#fff; font-size:13px; display:flex; align-items:center; justify-content:center; }
    .dot.done{ background:var(--pine); border-color:var(--pine); }
    .txt{ flex:1; font-family:var(--sans); font-size:16px; color:var(--ink); word-break:break-word; }
    .txt.done{ color:var(--muted); text-decoration:line-through; text-decoration-color:var(--muted); }
    .del{ flex:none; border:none; background:transparent; color:var(--muted); font-size:18px; padding:6px; }
    .empty{ text-align:center; padding:48px 0; color:var(--muted); font-family:var(--serif); font-size:16px; }

    footer{ margin-top:24px; display:flex; align-items:center; justify-content:space-between; font-family:var(--mono); font-size:12px; color:var(--muted); }
    .save{ display:flex; align-items:center; gap:6px; }
    .savedot{ width:6px; height:6px; border-radius:999px; background:var(--pine); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="eyebrow" id="date"></div>
      <h1>할 일</h1>
      <div class="progress">
        <div class="track"><div class="bar" id="bar"></div></div>
        <span class="pct" id="pct">00%</span>
      </div>
    </header>

    <div class="inputRow">
      <input id="field" type="text" placeholder="새 할 일을 적어보세요" enterkeyhint="done" />
      <button class="add" id="addBtn" aria-label="추가">+</button>
    </div>

    <div class="filters">
      <button class="chip on" data-f="all">전체</button>
      <button class="chip" data-f="active">진행</button>
      <button class="chip" data-f="done">완료</button>
      <span class="sp"></span>
      <button class="clear" id="clearBtn" style="display:none">완료 항목 비우기</button>
      <button class="clear" id="searchToggle">검색조건 펼치기</button>
    </div>

    <div class="inputRow searchRow" id="searchRow">
      <input id="searchField" type="text" placeholder="할 일 검색" enterkeyhint="search" />
    </div>

    <ul id="list"></ul>

    <footer id="foot" style="display:none">
      <span id="count"></span>
      <span class="save"><span class="savedot"></span>저장됨</span>
    </footer>
  </div>

  <script>
    var KEY = 'todos:v1';
    var todos = [];
    var filter = 'all';
    var searchQuery = '';

    function load(){
      try { var raw = localStorage.getItem(KEY); if(raw) todos = JSON.parse(raw); }
      catch(e){ todos = []; }
    }
    function save(){
      try { localStorage.setItem(KEY, JSON.stringify(todos)); } catch(e){}
    }

    var field = document.getElementById('field');
    var addBtn = document.getElementById('addBtn');
    var list = document.getElementById('list');
    var bar = document.getElementById('bar');
    var pct = document.getElementById('pct');
    var foot = document.getElementById('foot');
    var count = document.getElementById('count');
    var clearBtn = document.getElementById('clearBtn');
    var searchToggle = document.getElementById('searchToggle');
    var searchRow = document.getElementById('searchRow');
    var searchField = document.getElementById('searchField');

    function pad(n){ return String(n).padStart(2,'0'); }

    function setDate(){
      var d = new Date();
      var days = ['일','월','화','수','목','금','토'];
      document.getElementById('date').textContent =
        d.getFullYear() + '. ' + pad(d.getMonth()+1) + '. ' + pad(d.getDate()) + ' (' + days[d.getDay()] + ')';
    }

    function add(){
      var t = field.value.trim();
      if(!t) return;
      todos.unshift({ id: Date.now(), text: t, done: false });
      field.value = '';
      addBtn.classList.remove('on');
      save(); render(); field.focus();
    }
    function toggle(id){
      todos = todos.map(function(x){ return x.id===id ? Object.assign({}, x, {done:!x.done}) : x; });
      save(); render();
    }
    function remove(id){
      todos = todos.filter(function(x){ return x.id!==id; });
      save(); render();
    }
    function clearDone(){
      todos = todos.filter(function(x){ return !x.done; });
      save(); render();
    }

    function render(){
      var total = todos.length;
      var done = todos.filter(function(x){return x.done;}).length;
      var remaining = total - done;
      var p = total===0 ? 0 : Math.round(done/total*100);
      bar.style.width = p + '%';
      pct.textContent = pad(p) + '%';

      clearBtn.style.display = done>0 ? '' : 'none';
      foot.style.display = total>0 ? 'flex' : 'none';
      count.textContent = '남은 일 ' + pad(remaining) + ' / ' + pad(total);

      var q = searchQuery.trim().toLowerCase();
      var shown = todos.filter(function(x){
        var matchesFilter = filter==='active' ? !x.done : filter==='done' ? x.done : true;
        var matchesSearch = q==='' || x.text.toLowerCase().indexOf(q) > -1;
        return matchesFilter && matchesSearch;
      });

      list.innerHTML = '';
      if(shown.length===0){
        var li = document.createElement('li');
        li.className = 'empty';
        li.textContent = total===0
          ? '아직 할 일이 없어요. 위에 하나 추가해 보세요.'
          : q!==''
          ? '검색 결과가 없어요.'
          : filter==='done' ? '완료한 일이 아직 없어요.'
          : '진행 중인 일이 없어요. 잘 하고 있네요.';
        list.appendChild(li);
        return;
      }

      shown.forEach(function(x){
        var li = document.createElement('li'); li.className='item';

        var dot = document.createElement('button');
        dot.className = 'dot' + (x.done?' done':'');
        dot.textContent = x.done ? '✓' : '';
        dot.setAttribute('aria-label', x.done?'완료 취소':'완료 표시');
        dot.onclick = function(){ toggle(x.id); };

        var span = document.createElement('span');
        span.className = 'txt' + (x.done?' done':'');
        span.textContent = x.text;
        span.onclick = function(){ toggle(x.id); };

        var del = document.createElement('button');
        del.className = 'del'; del.textContent = '✕';
        del.setAttribute('aria-label','삭제');
        del.onclick = function(){ remove(x.id); };

        li.appendChild(dot); li.appendChild(span); li.appendChild(del);
        list.appendChild(li);
      });
    }

    addBtn.onclick = add;
    field.addEventListener('input', function(){
      addBtn.classList.toggle('on', field.value.trim().length>0);
    });
    field.addEventListener('keydown', function(e){ if(e.key==='Enter') add(); });
    clearBtn.onclick = clearDone;
    searchToggle.onclick = function(){
      var opening = !searchRow.classList.contains('open');
      searchRow.classList.toggle('open', opening);
      searchToggle.textContent = opening ? '검색조건 접기' : '검색조건 펼치기';
      if(opening){
        searchField.focus();
      } else {
        searchField.value = '';
        searchQuery = '';
        render();
      }
    };
    searchField.addEventListener('input', function(){
      searchQuery = searchField.value;
      render();
    });
    Array.prototype.forEach.call(document.querySelectorAll('.chip'), function(c){
      c.onclick = function(){
        filter = c.getAttribute('data-f');
        Array.prototype.forEach.call(document.querySelectorAll('.chip'), function(o){ o.classList.remove('on'); });
        c.classList.add('on');
        render();
      };
    });

    setDate(); load(); render();
  </script>
</body>
</html>
